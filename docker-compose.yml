version: '3.8'

services:
  # MySQL Database Container
  mysqldb:
    image: mysql:8.0
    container_name: interviewroom-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: interviewroom_db
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - interviewroom-net

  # Monolithic Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: interviewroom-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb:3306/interviewroom_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    depends_on:
      - mysqldb
    networks:
      - interviewroom-net

  # React 18 Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: interviewroom-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - interviewroom-net

networks:
  interviewroom-net:
    driver: bridge

volumes:
  mysql_data:
